<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activities Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 500px; width: 100%; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-height: 44px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; }
        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            font-size: 16px;
            width: auto;
            min-height: auto;
        }
        .tab.active { color: #667eea; border-bottom: 3px solid #667eea; margin-bottom: -2px; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .error { color: #d32f2f; font-size: 13px; margin-top: 10px; }
        .success { color: #388e3c; font-size: 13px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Daily Activities</h1>

            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="login" class="form-section active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Password">
                </div>
                <button id="login-btn">Sign In</button>
                <div id="login-message"></div>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signup" class="form-section hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Password (min 6 chars)">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm Password">
                </div>
                <button id="signup-btn">Create Account</button>
                <div id="signup-message"></div>
            </div>

            <!-- LOGGED IN SECTION -->
            <div id="app-view" class="hidden">
                <p id="user-email" style="text-align: center; margin-bottom: 20px; color: #667eea;"></p>
                <button onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase config - pre-embedded
        const SUPABASE_URL = 'https://zvjrlyvxlpftdsetrlcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZREsvm28B9szkjFVoSz7AQ_ij7bFN3e';

        let supabaseClient = null;
        let currentUser = null;

        // Initialize Supabase
        function initSupabase() {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                checkUser();
            } else {
                setTimeout(initSupabase, 100);
            }
        }

        // Check if user is logged in
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                currentUser = user;
                showAppView();
            }
        }

        // Show app after login
        function showAppView() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('signup').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-email').textContent = `Logged in as: ${currentUser.email}`;
        }

        // Show login/signup
        function showAuthView() {
            document.getElementById('login').classList.remove('hidden');
            document.getElementById('signup').classList.add('hidden');
            document.getElementById('app-view').classList.add('hidden');
            document.querySelector('[data-tab="login"]').classList.add('active');
            document.querySelector('[data-tab="signup"]').classList.remove('active');
        }

        // Logout
        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            showAuthView();
        }

        // Handle login
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msg = document.getElementById('login-message');

            if (!email || !password) {
                msg.innerHTML = '<div class="error">Please enter email and password</div>';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                currentUser = data.user;
                showAppView();
            } catch (err) {
                msg.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        });

        // Handle signup
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const confirm = document.getElementById('signup-confirm').value.trim();
            const msg = document.getElementById('signup-message');

            if (!email || !password || !confirm) {
                msg.innerHTML = '<div class="error">Please fill in all fields</div>';
                return;
            }

            if (password !== confirm) {
                msg.innerHTML = '<div class="error">Passwords do not match</div>';
                return;
            }

            if (password.length < 6) {
                msg.innerHTML = '<div class="error">Password must be at least 6 characters</div>';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) throw error;

                msg.innerHTML = '<div class="success">Account created! You can now log in.</div>';
                document.getElementById('signup-email').value = '';
                document.getElementById('signup-password').value = '';
                document.getElementById('signup-confirm').value = '';
            } catch (err) {
                msg.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        });

        // Tab switching
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');

                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(s => s.classList.add('hidden'));

                tab.classList.add('active');
                document.getElementById(tabName).classList.remove('hidden');

                // Clear messages
                document.getElementById('login-message').innerHTML = '';
                document.getElementById('signup-message').innerHTML = '';
            });
        });

        // Start app
        initSupabase();
    </script>
</body>
</html>
