<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activities Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-height: 44px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; }
        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            font-size: 16px;
            width: auto;
            min-height: auto;
        }
        .tab.active { color: #667eea; border-bottom: 3px solid #667eea; margin-bottom: -2px; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .error { color: #d32f2f; font-size: 13px; margin-top: 10px; }
        .success { color: #388e3c; font-size: 13px; margin-top: 10px; }
        .hidden { display: none; }
        .activity-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .activity-text { font-size: 20px; font-weight: 600; }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-height: 100px;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .entry { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #667eea; }
        .entry-date { font-size: 12px; color: #999; margin-bottom: 5px; }
        .entry-activity { font-weight: 600; color: #667eea; margin-bottom: 8px; }
        .entry-notes { font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Daily Activities</h1>

            <!-- AUTH VIEW -->
            <div id="auth-view">
                <div class="tabs">
                    <button class="tab active" data-tab="login">Login</button>
                    <button class="tab" data-tab="signup">Sign Up</button>
                </div>

                <!-- LOGIN FORM -->
                <div id="login" class="form-section active">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Password">
                    </div>
                    <button id="login-btn">Sign In</button>
                    <div id="login-message"></div>
                </div>

                <!-- SIGNUP FORM -->
                <div id="signup" class="form-section hidden">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="Password (min 6)">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signup-confirm" placeholder="Confirm">
                    </div>
                    <button id="signup-btn">Create Account</button>
                    <div id="signup-message"></div>
                </div>
            </div>

            <!-- APP VIEW -->
            <div id="app-view" class="hidden">
                <p id="user-email" style="text-align: center; margin-bottom: 20px; color: #667eea; font-size: 14px;"></p>

                <div class="activity-box">
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">Today's Activity</div>
                    <div class="activity-text" id="activity-text">Loading...</div>
                    <button style="margin-top: 15px; padding: 10px; font-size: 14px; min-height: 40px;" onclick="getNextActivity()">Next</button>
                </div>

                <div class="form-group">
                    <label>Your Notes</label>
                    <textarea id="notes" placeholder="How did this make you feel?"></textarea>
                </div>

                <button onclick="saveEntry()">Save Entry</button>
                <div id="app-message"></div>

                <div id="app-content" style="margin-top: 30px;">
                    <h3 style="margin-bottom: 15px;">Recent Entries</h3>
                    <div id="entries-list"></div>
                </div>

                <button onclick="logout()" style="margin-top: 30px; background: #f0f0f0; color: #333;">Sign Out</button>
            </div>
        </div>
    </div>

    <script>
        // Wait for Firebase to load
        function waitForFirebase() {
            return new Promise((resolve) => {
                if (window.firebase) {
                    resolve();
                } else {
                    setTimeout(() => waitForFirebase().then(resolve), 100);
                }
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA-Sw7_7Tp8B1mvhTuuXroK00xagv9pxo4",
            authDomain: "things-11510.firebaseapp.com",
            projectId: "things-11510",
            storageBucket: "things-11510.firebasestorage.app",
            messagingSenderId: "626185939822",
            appId: "1:626185939822:web:2df605b0b14c710df1af7f",
            databaseURL: "https://things-11510-default-rtdb.firebaseio.com"
        };

        waitForFirebase().then(() => {
            firebase.initializeApp(firebaseConfig);
        });
        let auth, db;
        waitForFirebase().then(() => {
            auth = firebase.auth();
            db = firebase.database();
        });

        const ACTIVITIES = [
            "Take a walk outside without your phone",
            "Draw or paint something",
            "Write in a journal for 10 minutes",
            "Sit quietly and do nothing for 5 minutes",
            "Read a chapter from a book",
            "Cook a simple meal from scratch",
            "Listen to a song you love",
            "Call a friend or family member",
            "Stretch your body mindfully",
            "Organize one small area of your space",
            "Take a warm bath or shower",
            "Make tea and sit with it",
            "Look at old photos",
            "Write a letter (even if you don't send it)",
            "Do something kind for someone",
            "Sit outside and observe nature",
            "Practice deep breathing",
            "Dance to your favorite song",
            "Watch your favorite movie scene",
            "Play with a pet"
        ];

        let currentUser = null;
        let currentActivityIndex = 0;

        function getTodayActivityIndex() {
            const today = new Date().toDateString();
            const seed = today.split(' ').reduce((a, s) => a + s.charCodeAt(0), 0);
            return seed % ACTIVITIES.length;
        }

        function getNextActivity() {
            currentActivityIndex = (currentActivityIndex + 1) % ACTIVITIES.length;
            document.getElementById('activity-text').textContent = ACTIVITIES[currentActivityIndex];
        }

        function updateActivityDisplay() {
            currentActivityIndex = getTodayActivityIndex();
            document.getElementById('activity-text').textContent = ACTIVITIES[currentActivityIndex];
        }

        function showAuthView() {
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('app-view').classList.add('hidden');
        }

        function showAppView() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-email').textContent = `Logged in as: ${currentUser.email}`;
            updateActivityDisplay();
            loadEntries();
        }

        async function logout() {
            await auth.signOut();
            currentUser = null;
            showAuthView();
        }

        async function saveEntry() {
            const notes = document.getElementById('notes').value.trim();
            const msg = document.getElementById('app-message');

            if (!notes) {
                msg.innerHTML = '<div class="error">Please add a note</div>';
                return;
            }

            try {
                const timestamp = new Date().getTime();
                await db.ref(`users/${currentUser.uid}/entries/${timestamp}`).set({
                    activity: ACTIVITIES[currentActivityIndex],
                    notes: notes,
                    timestamp: timestamp,
                    date: new Date().toDateString()
                });

                document.getElementById('notes').value = '';
                msg.innerHTML = '<div class="success">Entry saved!</div>';
                setTimeout(() => msg.innerHTML = '', 3000);
                loadEntries();
            } catch (err) {
                msg.innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        function loadEntries() {
            const entriesList = document.getElementById('entries-list');

            db.ref(`users/${currentUser.uid}/entries`).orderByChild('timestamp').limitToLast(10).on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    entriesList.innerHTML = '<p style="text-align: center; color: #999;">No entries yet</p>';
                    return;
                }

                const entries = [];
                snapshot.forEach((child) => {
                    entries.unshift(child.val());
                });

                entriesList.innerHTML = entries.map(entry => {
                    const date = new Date(entry.timestamp);
                    return `
                        <div class="entry">
                            <div class="entry-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
                            <div class="entry-activity">${entry.activity}</div>
                            <div class="entry-notes">${entry.notes}</div>
                        </div>
                    `;
                }).join('');
            });
        }

        // Tab switching
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(s => s.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tabName).classList.remove('hidden');
            });
        });

        // Login
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msg = document.getElementById('login-message');

            if (!email || !password) {
                msg.innerHTML = '<div class="error">Please enter email and password</div>';
                return;
            }

            try {
                const result = await auth.signInWithEmailAndPassword(email, password);
                currentUser = result.user;
                showAppView();
            } catch (err) {
                msg.innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        // Signup
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const confirm = document.getElementById('signup-confirm').value.trim();
            const msg = document.getElementById('signup-message');

            if (!email || !password || !confirm) {
                msg.innerHTML = '<div class="error">Please fill all fields</div>';
                return;
            }

            if (password !== confirm) {
                msg.innerHTML = '<div class="error">Passwords do not match</div>';
                return;
            }

            if (password.length < 6) {
                msg.innerHTML = '<div class="error">Password must be 6+ characters</div>';
                return;
            }

            try {
                const result = await auth.createUserWithEmailAndPassword(email, password);
                currentUser = result.user;
                showAppView();
            } catch (err) {
                msg.innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        // Check auth state
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                showAppView();
            } else {
                currentUser = null;
                showAuthView();
            }
        });
    </script>
</body>
</html>
